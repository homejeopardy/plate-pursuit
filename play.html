<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0e1726">
<title>Plate Pursuit · Buzzer</title>
<link rel="stylesheet" href="style.css?v=11">
</head>
<body class="phone-page">
<div class="phone" id="app"></div>
<script src="mode.js?v=11"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="shared.js?v=11"></script>
<script>
const app = document.getElementById('app');
if (PP.needRoom('JOIN THE GAME')) throw new Error('waiting for room code');
const KEY = 'plate-pursuit-team' + (PP.room ? '-' + PP.room : '');
let me = null;
try { me = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
let pending = false, lastBuzzMine = false;

let joining = false;
function showJoin(msg, keepName = '') {
  joining = false;
  app.innerHTML = `<div class="p-join">
    <div class="p-plate">${plateHTML('PL8 PRST')}</div>
    <h1>JOIN THE GAME</h1>
    ${PP.room ? `<div class="p-small">Room <b class="room-code">${esc(PP.room)}</b> · <button id="otherRoom">different room</button></div>` : ''}
    <input id="name" maxlength="24" placeholder="Team name" autocomplete="off" value="${esc(keepName)}">
    <button class="btn primary" id="go">Join</button>
    <div class="p-status ${msg ? 'bad' : ''}" id="jstatus">${esc(msg || '')}</div>
    <div class="p-small">Everyone on a team can use one phone.</div></div>`;
  const go = async () => {
    if (joining) return;
    const name = document.getElementById('name').value.trim();
    if (!name) return document.getElementById('name').focus();
    joining = true;
    const btn = document.getElementById('go');
    btn.disabled = true; btn.textContent = 'Joining…';
    joinStatus();
    const r = await PP.post('/join', { name });
    if (!r.ok) return showJoin(PP.local ? "Couldn't reach the game. Is this phone on the same Wi-Fi as the host's computer?"
      : (PP.status || "Couldn't reach the host. Check the room code and try again."), name);
    me = { id: r.team.id };
    try { localStorage.setItem(KEY, JSON.stringify(me)); } catch (e) {}
    start();
  };
  document.getElementById('go').onclick = go;
  document.getElementById('name').onkeydown = e => { if (e.key === 'Enter') go(); };
  const other = document.getElementById('otherRoom');
  if (other) other.onclick = () => { location.search = ''; };
}
// While joining, show what the connection is doing instead of a silent button.
function joinStatus() {
  const el = document.getElementById('jstatus');
  if (!el || !joining) return;
  el.className = 'p-status';
  el.textContent = PP.status || 'Connecting to the host…';
}
PP.on(joinStatus);

function start() {
  app.innerHTML = `<div class="p-top"><div class="sign green p-name" id="nm"></div><div class="p-score" id="sc"></div></div>
    <div class="p-msg" id="msg"></div>
    <div class="p-colors" id="colors" hidden></div>
    <div class="p-final" id="final" hidden></div>
    <div class="p-buzz-wrap" id="buzzWrap"><button class="p-buzz" id="buzz" disabled><span id="buzzLabel">BUZZ</span></button></div>
    <div class="p-small" id="foot"></div>`;
  const b = document.getElementById('buzz');
  const press = async e => {
    e.preventDefault();
    if (b.disabled || pending) return;
    pending = true; b.disabled = true;
    const r = await PP.post('/buzz', { teamId: me.id });
    pending = false;
    if (r.won && navigator.vibrate) navigator.vibrate(200);
    render(PP.state);
  };
  b.addEventListener('pointerdown', press);
  PP.connect(me.id);
}

function render(s) {
  if (!s || !me || !document.getElementById('buzz')) return;
  const t = s.teams.find(x => x.id === me.id);
  if (!t) {   // host removed the team, or a new game started
    try { localStorage.removeItem(KEY); } catch (e) {}
    me = null; showJoin('Your team was removed. Join again.'); return;
  }
  const $ = id => document.getElementById(id);
  $('nm').textContent = t.name;
  app.style.cssText = teamStyle(t);
  renderColors(s, t);
  $('sc').textContent = t.score;
  const b = $('buzz');
  let msg = '', enabled = false, mine = false, label = 'BUZZ';
  const locked = s.locked.includes(me.id);
  const dbl = (s.puzzles[s.cur] || {}).double && !s.tb;
  const finalPhase = ['fwager', 'fanswer', 'fjudge'].includes(s.phase) && s.fin;
  $('buzzWrap').hidden = !!finalPhase;
  $('final').hidden = !finalPhase;
  if (finalPhase) renderFinal(s, t);
  switch (s.phase) {
    case 'lobby': msg = "You're in. Waiting for the game to start."; break;
    case 'ready': msg = dbl ? '<b>Double points!</b> Next plate coming up' : 'Next plate coming up'; break;
    case 'paused': msg = locked ? 'Locked out for this plate' : 'Get ready to buzz…'; break;
    case 'running':
      if (locked) msg = 'Locked out for this plate'; else { msg = dbl ? '<b>Double points! Buzz when you know it!</b>' : '<b>Buzz when you know it!</b>'; enabled = true; }
      break;
    case 'fwager': msg = '<b>Final plate!</b> Bet some of your points.'; break;
    case 'fanswer': msg = '<b>Final plate!</b> Type your answer.'; break;
    case 'fjudge': msg = 'Final plate: the host is checking answers.'; break;
    case 'buzzed':
      if (s.buzzed === me.id) { msg = '<b>You buzzed first. Say your answer out loud!</b>'; mine = true; label = s.answerEndsAt ? String(Math.ceil(ppAnswerLeft(s))) : 'YOU!'; }
      else msg = `${esc(teamName(s, s.buzzed))} is answering`;
      break;
    case 'revealed': {
      const p = s.puzzles[s.cur] || {};
      msg = s.result && s.result.teamId === me.id ? (s.result.tiebreak ? '<b>You won the tie-breaker!</b>' : `<b>+${s.result.points} points!</b>`) : `Answer: <b>${esc(p.answer)}</b>`;
      break;
    }
    case 'speedready': case 'speed': case 'speedover':
      msg = s.speed.teamId === me.id ? '<b>Speed round: it\'s your turn! Look at the screen.</b>' : `Speed round: ${esc(teamName(s, s.speed.teamId))}`;
      if (s.phase === 'speedover') msg = `Speed round over: ${s.speed.count} solved`;
      break;
    case 'final': {
      const ranks = ppRanking(s), mineR = ranks.find(r => r.team.id === me.id);
      const firsts = ranks.filter(r => r.rank === 1).length;
      msg = mineR && mineR.rank === 1 ? (firsts > 1 ? '<b>Tied for first!</b>' : '<b>You won!</b>') : `You finished #${mineR ? mineR.rank : '?'}`;
      break;
    }
  }
  // tie-breaker: teams that aren't tied just watch
  if (s.tb && ['ready', 'running', 'buzzed', 'paused'].includes(s.phase) && !s.tb.teams.includes(me.id))
    msg = 'Tie-breaker: ' + s.tb.teams.map(id => esc(teamName(s, id))).join(' vs ');
  else if (s.tb && s.phase === 'ready') msg = '<b>Tie-breaker!</b> First right answer wins.';
  $('msg').innerHTML = msg;
  b.disabled = !enabled || pending;
  b.classList.toggle('mine', mine);
  $('buzzLabel').textContent = label;
  $('buzz').classList.toggle('counting', mine && !!s.answerEndsAt);
  $('foot').innerHTML = PP.connected && !PP.status ? `<button id="pickColor">Change color</button> &nbsp;·&nbsp; <button id="leave">Switch team</button>` : esc(PP.status || 'Reconnecting…');
  const pc = $('pickColor');
  if (pc) pc.onclick = () => { pickerOpen = !pickerOpen; colorKey = ''; render(PP.state); };
  const lv = $('leave');
  if (lv) lv.onclick = () => { if (confirm('Leave this team on this phone?')) { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); } };
}

// ---- colour picker: shown on the join screen phase, or when "Change color" is tapped
let pickerOpen = false, colorKey = '', colorMsg = '';
function renderColors(s, t) {
  const el = document.getElementById('colors');
  const show = s.phase === 'lobby' || pickerOpen;
  el.hidden = !show;
  if (!show) return;
  const key = JSON.stringify([s.teams.map(x => x.id + x.color), colorMsg]);
  if (key === colorKey) return;
  colorKey = key;
  el.innerHTML = `<div class="p-label">Your team color</div><div class="sw">` + Object.keys(TEAM_COLORS).map(c => {
    const owner = s.teams.find(x => x.color === c);
    const mine = owner && owner.id === t.id, taken = owner && !mine;
    return `<button data-color="${c}" class="${mine ? 'on' : ''}" style="--team:${TEAM_COLORS[c]}" ${taken ? 'disabled' : ''} aria-label="${c}${taken ? ' (taken)' : ''}"></button>`;
  }).join('') + `</div>${colorMsg ? `<div class="p-status">${esc(colorMsg)}</div>` : ''}`;
  el.querySelectorAll('[data-color]').forEach(b => b.onclick = async () => {
    const r = await PP.post('/color', { teamId: me.id, color: b.dataset.color });
    colorMsg = r.ok ? '' : r.taken ? 'Another team just took that color.' : "Couldn't change color. Try again.";
    if (r.ok && s.phase !== 'lobby') pickerOpen = false;
    colorKey = ''; render(PP.state);
  });
}

// ---- final plate panel: rebuilt only when the step changes, so typing isn't wiped out
let finalKey = '';
function renderFinal(s, t) {
  const f = s.fin, el = document.getElementById('final');
  const w = f.wagers[me.id], a = f.answers[me.id], m = f.marks[me.id];
  const key = s.phase + '|' + (s.phase === 'fjudge' ? [w, a, m].join('|') : '');
  if (key === finalKey) { finalStatus(s); return; }
  finalKey = key;
  const max = Math.max(0, t.score);
  if (s.phase === 'fwager') {
    el.innerHTML = max > 0
      ? `<label class="p-label">Your bet (0 to ${max})</label>
         <input id="wagerIn" type="number" inputmode="numeric" min="0" max="${max}" value="${w != null ? w : ''}" placeholder="0">
         <button class="btn primary" id="wagerGo">Lock in bet</button><div class="p-status" id="fstatus"></div>`
      : `<div class="p-status">You have no points to bet, so your bet is 0. You can still answer.</div>`;
    const go = document.getElementById('wagerGo');
    if (go) go.onclick = async () => {
      const amount = document.getElementById('wagerIn').value;
      go.disabled = true; go.textContent = 'Sending…';
      const r = await PP.post('/wager', { teamId: me.id, amount });
      go.disabled = false; go.textContent = 'Lock in bet';
      if (r.ok) document.getElementById('wagerIn').value = r.amount;
      else document.getElementById('fstatus').textContent = "Couldn't send your bet. Try again.";
      finalStatus(PP.state);
    };
  } else if (s.phase === 'fanswer') {
    el.innerHTML = `<div class="p-cd" id="fcd"></div>
      <label class="p-label">Your answer (bet: ${w || 0})</label>
      <input id="answerIn" maxlength="60" autocomplete="off" autocapitalize="sentences" value="${esc(a || '')}" placeholder="What does it say?">
      <button class="btn primary" id="answerGo">Send answer</button><div class="p-status" id="fstatus"></div>`;
    const go = document.getElementById('answerGo'), inp = document.getElementById('answerIn');
    const send = async () => {
      go.disabled = true; go.textContent = 'Sending…';
      const r = await PP.post('/answer', { teamId: me.id, text: inp.value });
      go.disabled = false; go.textContent = 'Send answer';
      if (!r.ok) document.getElementById('fstatus').textContent = "Couldn't send. Try again.";
      finalStatus(PP.state);
    };
    go.onclick = send;
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); send(); } };
  } else {
    el.innerHTML = `<div class="p-label">Your answer</div><div class="p-answer">${esc(a || '(no answer)')}</div>
      <div class="p-label">Your bet: ${w || 0}</div>
      <div class="p-result ${m === true ? 'good' : m === false ? 'bad' : ''}">${m === true ? `Right! +${w || 0}` : m === false ? `Not quite. −${w || 0}` : 'Waiting for the host…'}</div>`;
  }
  finalStatus(s);
}
function finalStatus(s) {
  const st = document.getElementById('fstatus'); if (!st || !s || !s.fin) return;
  if (s.phase === 'fwager') { const w = s.fin.wagers[me.id]; if (w != null) st.textContent = `Your bet: ${w}. You can change it until the plate is shown.`; }
  if (s.phase === 'fanswer') { const a = s.fin.answers[me.id]; if (a != null) st.textContent = `Sent: "${a}". You can change it until time runs out.`; }
}

PP.on(render);
setInterval(() => { const s = PP.state, el = document.getElementById('fcd'); if (el && s && s.phase === 'fanswer') { const l = ppFinalLeft(s); el.textContent = l == null ? '' : Math.ceil(l) + 's'; } }, 200);
// tick the answer countdown on the phone that buzzed
setInterval(() => { const s = PP.state; if (s && s.phase === 'buzzed' && me && s.buzzed === me.id && document.getElementById('buzzLabel')) document.getElementById('buzzLabel').textContent = Math.ceil(ppAnswerLeft(s)); }, 100);
if (me && me.id) start(); else { showJoin(); if (!PP.local) PP.connect(); }
</script>
</body>
</html>

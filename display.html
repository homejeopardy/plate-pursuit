<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plate Pursuit · Projector</title>
<link rel="stylesheet" href="style.css?v=20">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="display-page">
<div class="display">
  <div class="d-head"><div class="sign green d-title">PLATE PURSUIT</div><div class="sign white d-round" id="round"></div></div>
  <div class="d-stage" id="stage"></div>
  <div class="d-teams" id="teams"></div>
</div>
<div class="unlock" id="unlock"><div class="sign green">Click to start the projector<small>Turns on sound and goes full screen</small></div></div>
<div class="conn" id="conn"></div>

<script src="mode.js?v=20"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="states.js?v=20"></script>
<script src="shared.js?v=20"></script>
<script>
const $ = id => document.getElementById(id);
let lastEv = null, lastKey = '', lastPlateKey = '';

$('unlock').onclick = () => {
  SFX.unlock();
  $('unlock').remove();
  document.documentElement.requestFullscreen?.().catch(() => {});
};

function stageKey(s) {
  // Re-render the stage only when what it shows changes; the clock ticks separately.
  return JSON.stringify([s.phase, s.cur, s.buzzed, s.result, s.speed && s.speed.count, s.joinUrl, s.room, s.teams.map(t => t.name + t.color), !!p_double(s), s.tb, s.tbWinner, s.fin && s.fin.marks, s.step, s.fin && s.fin.shown, s.phase === 'final' ? s.teams.map(t => t.score) : 0]);
}

const p_double = s => (s.puzzles[s.cur] || {}).double && ['ready', 'running', 'buzzed', 'paused', 'revealed'].includes(s.phase) && !s.tb;
function renderStage(s) {
  const p = s.puzzles[s.cur] || {};
  const st = $('stage');
  let html = '';
  const plateKey = s.phase + ':' + s.cur;
  const enter = plateKey !== lastPlateKey && ['running', 'speed', 'ready'].includes(s.phase) ? 'enter' : '';
  lastPlateKey = plateKey;

  if (s.phase === 'lobby') {
    const url = s.joinUrl;
    const n = s.teams.length;
    html = `<div class="d-lobby">
      <div class="d-plate">${plateHTML('PL8 PRST', { bottom: 'CRACK THE CODE' })}</div>
      <div class="d-join"><div id="qr"></div><div class="sign green"><div class="k">Join on your phone</div><div class="u">${esc(url.replace(/^https?:\/\//, ''))}</div>${s.room ? `<div class="k">Room code <b class="room-code">${esc(s.room)}</b></div>` : ''}
      <div class="j">${n ? n + (n > 1 ? ' teams' : ' team') + ' joined' : 'Waiting for teams'}</div></div></div>
      ${s.room ? '' : '<div class="d-wifi">Phones must be on the same Wi-Fi as this computer, not cellular data.</div>'}
    </div>`;
    st.innerHTML = html;
    if (window.QRCode) new QRCode($('qr'), { text: url, width: 220, height: 220, colorDark: '#151515', colorLight: '#ffffff' });
    else $('qr').remove();
    return;
  }
  if (s.phase === 'final') {
    const ranked = ppRanking(s);
    const firsts = ranked.filter(r => r.rank === 1).length;
    html = `<div class="sign green d-board"><div class="h">FINAL STANDINGS</div>
      ${ranked.map(r => `<div class="rank ${r.rank === 1 ? 'top' : ''}"><span><i class="swatch" style="${teamStyle(r.team)}"></i>${r.rank === 1 ? `<small class="tag">${firsts > 1 ? 'TIED' : 'WINNER'}</small>` : r.rank + '. '}${esc(r.team.name)}</span><span>${r.team.score}</span></div>`).join('')}</div>`;
    st.innerHTML = html; return;
  }
  if (s.phase === 'fwager' || s.phase === 'fanswer' || s.phase === 'fjudge') {
    const showing = s.phase !== 'fwager';
    const under = s.phase === 'fwager' ? `<div class="d-hint">Place your bet on your phone</div>`
      : s.phase === 'fanswer' ? `<div class="limit answer" id="answerSign"><div class="t">ANSWER</div><div class="n" id="answerNum"></div></div><div class="d-hint">Type your answer on your phone</div>`
      : `<div>${finalSpot(s)}<div class="d-answer">${s.fin && s.fin.shown < s.fin.order.length ? '' : answerPiecesHTML(p, s.step)}</div></div>`;
    html = `<div class="d-q"><div class="count">Final plate</div><div class="q">${esc(p.cat || '')}</div></div>
      <div class="d-plate ${s.phase === 'fanswer' && enter !== '' ? 'enter' : ''}">${puzzlePlate(p, { text: showing ? p.plate : 'BET NOW', cls: showing ? '' : 'covered', parts: s.phase === 'fjudge' && p.parts, step: s.step })}</div>
      <div class="d-under">${under}</div>`;
    st.innerHTML = html; tick(); return;
  }
  if (s.phase === 'speedready') {
    html = `<div class="d-q"><div class="count">${Math.round(s.settings.speedSeconds)}-second speed round</div><div class="q">${esc(teamName(s, s.speed.teamId))}, get ready</div></div>
      <div class="d-plate">${plateHTML('READY', { cls: 'covered', frame: '' })}</div>
      <div class="d-under"><div class="sign white d-clock" id="clock">${Math.ceil(s.settings.speedSeconds)}</div></div>`;
    st.innerHTML = html; return;
  }
  if (s.phase === 'speed' || s.phase === 'speedover') {
    const over = s.phase === 'speedover';
    html = `<div class="d-q"><div class="count">Speed round: ${esc(teamName(s, s.speed.teamId))}</div><div class="q">${over ? 'Time' : esc(p.cat || '')}</div></div>
      <div class="d-plate ${over ? '' : enter}">${puzzlePlate(p, { text: over ? 'TIME' : p.plate, cls: over ? 'covered' : '' })}</div>
      <div class="d-under"><div class="sign white d-clock" id="clock"></div><div class="d-speed-count"><b>${s.speed.count}</b> solved</div></div>`;
    st.innerHTML = html; tick(); return;
  }
  // ready / running / buzzed / revealed
  const covered = s.phase === 'ready';
  const showAnswer = s.phase === 'revealed';
  const lane = Array.from({ length: 10 }, () => '<i></i>').join('');
  const under = showAnswer
    ? `<div><div class="d-answer">${answerPiecesHTML(p, s.step)}</div>${s.result && s.result.tiebreak ? `<div class="d-result">${esc(teamName(s, s.result.teamId))} wins the tie-breaker</div>` : ''}</div>`
    : `<div class="limit"><div class="t">WORTH</div><div class="n" id="value"></div></div><div class="lane" id="lane">${lane}</div>`
      + `<div class="limit answer ${s.phase === 'buzzed' && s.answerEndsAt ? '' : 'idle'}" id="answerSign"><div class="t" id="answerLabel">ANSWER</div><div class="n" id="answerNum">${s.settings.answerSeconds || ''}</div></div>`;
  const dbl = p_double(s);
  const countLine = s.tb ? 'Tie-breaker: ' + s.tb.teams.map(id => esc(teamName(s, id))).join(' vs ') : `Plate ${s.used.length + (showAnswer ? 0 : 1)} of ${s.puzzles.length}`;
  html = `<div class="d-q"><div class="count">${countLine}${dbl ? ' <span class="d-double">Double points</span>' : ''}</div><div class="q">${esc(p.cat || '')}</div>${p.hint ? `<div class="d-hint-line">${esc(p.hint)}</div>` : ''}</div>
    <div class="d-plate ${enter}">${puzzlePlate(p, { text: covered ? (dbl ? 'DOUBLE' : '?') : p.plate, cls: covered ? 'covered' + (dbl ? ' double' : '') : '', parts: showAnswer && p.parts, step: s.step })}</div>
    <div class="d-under">${under}</div>`;
  st.innerHTML = html; tick();
}

// final plate: the team whose answer was put on screen last, big
function finalSpot(s) {
  const f = s.fin; if (!f || !f.shown) return '';
  const id = f.order[f.shown - 1], t = s.teams.find(x => x.id === id); if (!t) return '';
  const m = f.marks[id], w = f.wagers[id] || 0;
  return `<div class="d-spot sign green" style="${teamStyle(t)}"><div class="who">${esc(t.name)} wrote</div>
    <div class="what">${esc(f.answers[id] || '(no answer)')}</div>
    <div class="bet">bet ${w}${m === true ? ` <b class="plus">RIGHT +${w}</b>` : m === false ? ` <b class="minus">WRONG −${w}</b>` : ''}</div></div>`;
}
const finShown = (s, id) => !s.fin || s.phase !== 'fjudge' || s.fin.order.indexOf(id) < s.fin.shown;
function renderTeams(s) {
  const roundNames = { lobby: '', ready: 'Buzz-in round', running: 'Buzz-in round', buzzed: 'Buzz-in round', paused: 'Buzz-in round', revealed: 'Buzz-in round',
    speedready: 'Speed round', speed: 'Speed round', speedover: 'Speed round', final: 'Game over',
    fwager: 'Final plate', fanswer: 'Final plate', fjudge: 'Final plate' };
  $('round').textContent = s.tb && !['final', 'lobby'].includes(s.phase) ? 'Tie-breaker' : (roundNames[s.phase] || '');
  $('teams').innerHTML = s.teams.map(t => {
    const cls = [s.buzzed === t.id && s.phase === 'buzzed' ? 'buzzed' : '',
      s.locked.includes(t.id) && (['running', 'buzzed', 'paused'].includes(s.phase) || (s.tb && s.phase === 'ready')) ? 'out' : '',
      s.speed && s.speed.teamId === t.id && s.phase.startsWith('speed') ? 'active' : ''].join(' ');
    let sub = '';
    if (s.fin && s.phase === 'fwager') sub = s.fin.wagers[t.id] != null ? 'BET IN' : 'betting…';
    else if (s.fin && s.phase === 'fanswer') sub = s.fin.answers[t.id] != null ? 'ANSWERED' : 'typing…';
    else if (s.fin && s.phase === 'fjudge' && !finShown(s, t.id)) sub = '?';
    else if (s.fin && s.phase === 'fjudge') {
      const m = s.fin.marks[t.id], w = s.fin.wagers[t.id] || 0;
      sub = esc(s.fin.answers[t.id] || '(no answer)') + (m === true ? ` <b class="plus">+${w}</b>` : m === false ? ` <b class="minus">−${w}</b>` : '');
    }
    return `<div class="sign green d-team ${cls}" style="${teamStyle(t)}"><div class="n">${esc(t.name)}</div><div class="s">${finShown(s, t.id) ? t.score : (s.fin.base[t.id] ?? t.score)}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
  }).join('');
}


function tick() {
  const s = PP.state; if (!s) return;
  if (['ready', 'running', 'buzzed', 'paused'].includes(s.phase) && $('value')) {
    const v = s.phase === 'buzzed' ? s.valueAtBuzz : ppValue(s);
    $('value').textContent = v;
    const lit = s.phase === 'ready' ? 10 : Math.ceil(ppFraction(s) * 10);
    $('lane').querySelectorAll('i').forEach((d, i) => d.classList.toggle('off', i >= lit));
  }
  if ((s.phase === 'speed') && $('clock')) {
    const left = ppSpeedLeft(s);
    $('clock').textContent = Math.ceil(left);
    $('clock').classList.toggle('low', left <= 10);
  }
  if (s.phase === 'speedover' && $('clock')) $('clock').textContent = '0';
  if (s.phase === 'fanswer' && $('answerNum')) {
    const left = ppFinalLeft(s);
    $('answerNum').textContent = left == null ? '' : Math.ceil(left);
  } else if ($('answerNum')) {
    const counting = s.phase === 'buzzed' && s.answerEndsAt;
    $('answerSign').classList.toggle('idle', !counting);
    $('answerNum').textContent = counting ? Math.ceil(ppAnswerLeft(s)) : (s.settings.answerSeconds || '');
  }
}
setInterval(tick, 100);

if (PP.needRoom('PROJECTOR')) throw new Error('waiting for room code');
PP.on(s => {
  $('conn').textContent = PP.status || (PP.connected ? '' : 'Connecting…');
  if (!s) return;
  if (lastEv === null) lastEv = s.ev.n;
  else if (s.ev.n !== lastEv) { lastEv = s.ev.n; SFX.play(s.ev.type); }
  const k = stageKey(s);
  if (k !== lastKey) { lastKey = k; renderStage(s); }
  renderTeams(s); tick();
});
PP.connect();
</script>
</body>
</html>
